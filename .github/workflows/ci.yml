name: ci
on:
  pull_request: { branches: [dev, main] }
  push:         { branches: [dev, main] }

jobs:
  only-dev-to-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - env: { HEAD: "${{ github.head_ref }}" }   # via env, never inline: branch names are untrusted input
        run: '[ "$HEAD" = dev ] || { echo "main only accepts PRs from dev"; exit 1; }'

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
