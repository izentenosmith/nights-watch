[project]
name = "nights-watch"
version = "0.1.0"
description = "An alert fires; an agent investigates read-only and posts a ranked root-cause hypothesis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "prometheus-client>=0.26.0",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
